name: Daily Run and PR

on:
  schedule:
    - cron: '14 23 * * *' # Runs every day at 23:14 UTC
  workflow_dispatch: # Allows manual triggering of the workflow

permissions:
  contents: write

jobs:
  daily-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute KNKV cache key
        id: knkv_cache
        run: |
          echo "key=knkv-cache-v2-${{ runner.os }}-daily-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'

      # AI generated: only share cache snapshots from a complete successful scrape.
      - name: Scrape latest KNKV data (force network)
        id: scrape
        run: ./gradlew -Delo.scraper.forceNetwork=true -Delo.scraper.useStaticIndoorPoules=false scrape

      - name: Check for changes in matches/current.txt
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add matches/current.txt
          # AI generated: corrections and deletions also require recomputing snapshots.
          if git diff --cached --quiet -- matches/current.txt; then
            echo "CHANGES=0" >> "$GITHUB_ENV"
          else
            echo "CHANGES=1" >> "$GITHUB_ENV"
          fi

      - name: Find earliest changed match date in matches/current.txt
        if: env.CHANGES > 0
        id: find_date
        run: |
          # AI generated: include removed rows so corrected results are replayed from their original date.
          earliest_date=$(git diff --cached --unified=0 -- matches/current.txt | sed -nE 's/^[+-]([0-9]{4}-[0-9]{2}-[0-9]{2}),.*/\1/p' | sort | head -n 1)
          test -n "$earliest_date"
          echo "EARLIEST_DATE=$earliest_date" >> $GITHUB_ENV

      - name: Find indoor season
        if: env.CHANGES > 0
        run: |
          indoor_season=$(awk -F"'" '
            /export const INDOOR_SEASON/ { in_block=1; next }
            in_block && /seasonName:/ { print $2; exit }
          ' web/src/season.ts)
          test -n "$indoor_season"
          echo "INDOOR_SEASON=$indoor_season" >> "$GITHUB_ENV"

      - name: Remove lines from indoor season CSVs on or after earliest date
        if: env.CHANGES > 0
        run: |
          dir="web/public/csv/$INDOOR_SEASON"
          if [ ! -d "$dir" ]; then
            exit 0
          fi
          find "$dir" -maxdepth 1 -type f -name '*.csv' | while read -r file; do
            tmp=$(mktemp)
            awk -v date="$EARLIEST_DATE" 'NR == 1 || $1 < date' "$file" > "$tmp" && mv "$tmp" "$file"
          done

      # AI generated: refresh live zaal predictions only when results change.
      - name: Update indoor predictions and push changed artifacts
        if: env.CHANGES > 0
        run: |
          ./gradlew -Delo.scraper.useStaticIndoorPoules=false -Delo.scraper.writeCurrentMatches=false -Delo.predict.forceInitialOutput=true predict --args="$EARLIEST_DATE zaal"
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          # Commit the changes
          git commit -m "Automatic update of matches/current.txt and related data"

          # Push to the main branch
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save KNKV cache for other workflows
        if: always() && steps.scrape.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: cache
          key: ${{ steps.knkv_cache.outputs.key }}
